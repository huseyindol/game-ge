# Şablon: .claude/skills/web-deploy (studio) · game-ge: main → Godot Web export + Next.js public altına kopyalama + push
#
# Zorunlu secrets (Actions → Secrets and variables → Secrets):
#   NEXTJS_DEPLOY_TOKEN       — PAT; hedef Next.js reposunda contents:write
#   NEXTJS_DEPLOY_REPO        — örn. huseyindol/nextjs-approute-project
#   NEXTJS_PUBLIC_GAME_PATH   — public içi alt yol; örn. assets/games/game-ge
#
# Godot Web export göreli yollar kullanır; alt klasörde (iframe) olduğu gibi çalışır.
# Export preset'i "Web", thread_support=false olmalı (COOP/COEP başlığı gerektirmez).
#
# Üretilen sürüm dosyası: next-site içinde src/lib/game-ge-asset-version.generated.ts
# Next iframe örn.: `.../index.html?v=${GAME_GE_ASSET_CACHE_KEY}`
#
# Secrets eksikse build job'ı hemen hata verir; hedef repoya hiçbir şey yazılmaz.

name: Deploy Web to Next.js

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Art arda push'lar hedef repoya aynı anda yazmasın (sırayla çalışır).
concurrency:
  group: deploy-web-game-ge
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.6.2"
  EXPORT_PRESET: "Web"

jobs:
  build:
    name: Godot Web export
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.2
    steps:
      - name: Secret kontrolü
        env:
          PUBLIC_SUBPATH: ${{ secrets.NEXTJS_PUBLIC_GAME_PATH }}
        run: |
          SUB="${PUBLIC_SUBPATH#/}"
          SUB="${SUB%/}"
          if [ -z "${SUB}" ]; then
            echo "::error::NEXTJS_PUBLIC_GAME_PATH secret'ı boş; örn. assets/games/game-ge"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Godot ve export şablonları
        run: |
          mkdir -p ~/.local/share/godot/export_templates/
          mkdir -p ~/.config/
          if [ -d /root/.config/godot ]; then
            cp -a /root/.config/godot ~/.config/ || true
          fi
          if [ -d /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ]; then
            cp -a /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
              ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          else
            echo "Şablon klasörü bulunamadı: ${GODOT_VERSION}.stable"
            ls -la /root/.local/share/godot/export_templates/ || true
            exit 1
          fi

      # .godot/ repoda yok: içe aktarma ve global sınıf (class_name) önbelleği burada üretilir.
      # Bu adım olmadan ilk derlemede "Could not find type ..." hatası çıkar (crane-games).
      - name: Projeyi içe aktar
        run: |
          godot --headless --import || true
          godot --headless --import

      - name: Web export
        run: |
          mkdir -p build/web
          EXPORT_DIR="$(readlink -f build)"
          godot --headless --verbose --export-release "${EXPORT_PRESET}" "${EXPORT_DIR}/web/index.html"
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: Artifact
        uses: actions/upload-artifact@v4
        with:
          name: godot-web
          path: build/web
          retention-days: 14

  deploy:
    name: Next.js reposuna kopyala ve push
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Export indir
        uses: actions/download-artifact@v4
        with:
          name: godot-web
          path: build/web

      - name: Next.js reposunu checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.NEXTJS_DEPLOY_REPO }}
          token: ${{ secrets.NEXTJS_DEPLOY_TOKEN }}
          path: next-site

      - name: Godot çıktısını public altına kopyala
        env:
          PUBLIC_SUBPATH: ${{ secrets.NEXTJS_PUBLIC_GAME_PATH }}
        run: |
          set -euo pipefail
          SUB="${PUBLIC_SUBPATH#/}"
          SUB="${SUB%/}"
          # Boş yol "public/*" silinmesi demek olurdu; asla izin verme.
          if [ -z "${SUB}" ]; then
            echo "::error::NEXTJS_PUBLIC_GAME_PATH secret'ı boş"
            exit 1
          fi
          TARGET="next-site/public/${SUB}"
          rm -rf "${TARGET:?}"
          mkdir -p "${TARGET}"
          cp -a build/web/. "${TARGET}/"
          echo "Kopyalanan dosyalar:"
          ls -la "${TARGET}"

      - name: Sürüm dosyası (dinamik — Next iframe v=${GAME_GE_ASSET_CACHE_KEY})
        run: |
          set -euo pipefail
          OUT="next-site/src/lib/game-ge-asset-version.generated.ts"
          mkdir -p "$(dirname "${OUT}")"
          {
            echo '/** game-ge — GitHub Actions; elle düzenlemeyin. */'
            echo "export const GAME_GE_ASSET_CACHE_KEY = \"${{ github.run_id }}\";"
            echo "export const GAME_GE_ASSET_SHA = \"${{ github.sha }}\";"
          } > "${OUT}"

      - name: Commit ve push
        working-directory: next-site
        env:
          PUBLIC_SUBPATH: ${{ secrets.NEXTJS_PUBLIC_GAME_PATH }}
        run: |
          set -euo pipefail
          SUB="${PUBLIC_SUBPATH#/}"
          SUB="${SUB%/}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "public/${SUB}" "src/lib/game-ge-asset-version.generated.ts"
          if git diff --cached --quiet; then
            echo "Commit edilecek değişiklik yok"
            exit 0
          fi
          git commit -m "Deploy game-ge Godot web (${{ github.repository }}@${{ github.sha }} run ${{ github.run_id }})"
          git push
